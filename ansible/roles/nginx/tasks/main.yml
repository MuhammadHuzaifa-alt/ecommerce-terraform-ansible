---
- name: Ensure Nginx  is installed
  ansible.builtin.apt:
    name: "{{ nginx_package }}"
    state: present
    update_cache: true

- name: Deploy Nginx site configuration
  ansible.builtin.template:
    src: ecommerce.conf.j2
    dest: /etc/nginx/sites-available/ecommerce.conf
    owner: root
    group: root
    mode: "0644"
  notify: Validate and reload Nginx

- name: Enable the ecommerce Nginx site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/ecommerce.conf
    dest: /etc/nginx/sites-enabled/ecommerce.conf
    state: link
  notify: Validate and reload Nginx

- name: Disable the default Nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Validate and reload Nginx

- name: Ensure Nginx is running and enabled
  ansible.builtin.service:
    name: "{{ nginx_service_name }}"
    state: started
    enabled: true
